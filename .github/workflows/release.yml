name: Release

# See x402r-notes/sdk/RELEASING.md for the operator runbook.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a mid-release run — a partial publish leaves npm in an
  # inconsistent state. Queue subsequent dispatches instead.
  cancel-in-progress: false

jobs:
  # Job 1: open/update the "Version Packages" PR if there are pending
  # changesets. Doesn't publish anything. No publish secrets are needed
  # so no OIDC scope and no env gate.
  #
  # Ref guard: `workflow_dispatch` lets the operator pick any ref from
  # the branch dropdown. Without binding to main, a dispatch from a
  # stale feature branch could spend our `pull-requests: write` token
  # opening Version PRs against arbitrary refs. Matches the 22/23
  # upstream x402-ecosystem publish workflows that carry this guard.
  version:
    name: Version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}
    permissions:
      contents: write       # Push the version-bump commit
      pull-requests: write  # Open/update the Version Packages PR
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5  # v2.19.3
        with:
          egress-policy: audit

      # Mint a GitHub App installation token for changesets/action. Required
      # because PRs opened with the default GITHUB_TOKEN don't trigger
      # downstream workflows (GitHub Actions anti-recursion), which would
      # skip required CI on the Version Packages PR. App-token-opened PRs
      # trigger workflows like a human-opened PR would. See
      # x402r-notes/sdk/RELEASING.md.
      - name: Mint release-bot installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # Persist the App installation token in local git config so the
          # version-bump push to changeset-release/main authenticates.
          # changesets/action pushes via git CLI under the hood; env
          # GITHUB_TOKEN only flows to octokit and user scripts, so without
          # token: + persisted credentials the push has no auth.
          token: ${{ steps.app-token.outputs.token }}
          # Full history so changesets can generate complete changelogs.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093  # v6.0.8

      # No `cache: pnpm` here: the privileged release runner must not
      # deserialize the same cache that ci.yml writes to from
      # untrusted PR runs (cache-poisoning vector). Upstream
      # changesets/changesets uses `skip-cache: true` for the same
      # reason. Cold install costs ~10s per release run.
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version-file: .nvmrc

      # Note: no `Pin npm` step here. The version job only mutates files
      # via `changeset version` + opens a PR via the action — it never
      # calls `npm publish`, so the Trusted-Publishing-driven npm >= 11.5.1
      # pin is unused. The publish job has the pin where it's needed.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Create or update Version Packages PR
        id: changesets
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b  # v1.8.0
        with:
          version: pnpm exec changeset version
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  # Job 2: publish to npm. Only runs when the version job found NO
  # pending changesets (i.e., the Version PR was already merged on a
  # previous dispatch and the workspace versions are bumped + clean).
  #
  # Ref guard: same defense as the version job — bind to main so a
  # dispatch from a stale feature branch can't mint a valid OIDC token
  # and publish from an unintended ref (`environment + workflow filename`
  # alone doesn't restrict the ref).
  publish:
    name: Publish to npm
    if: github.ref == 'refs/heads/main' && needs.version.outputs.hasChangesets == 'false'
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Environment label matches the npm Trusted Publishing config on
    # npmjs.com for each @x402r/* package. Required-reviewer protection
    # on this environment is OPTIONAL — workflow_dispatch already gates
    # on maintainer access. To eliminate the second click entirely,
    # remove the required reviewer in Settings -> Environments ->
    # npm-publish; the environment label stays for OIDC scoping.
    environment: npm-publish
    permissions:
      contents: write    # Per-package release tags + GitHub releases
      id-token: write    # OIDC handshake for npm Trusted Publishing
    env:
      # Belt-and-suspenders with per-package publishConfig.provenance.
      # Either alone would work; together they guarantee Sigstore-backed
      # attestations on every published artifact.
      NPM_CONFIG_PROVENANCE: "true"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5  # v2.19.3
        with:
          egress-policy: audit

      # Mint a GitHub App installation token so GitHub release entries
      # created by changesets/action are attributed to the App rather
      # than github-actions[bot]. npm publishing itself uses Trusted
      # Publishing (OIDC) and does not consume this token.
      - name: Mint release-bot installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # Same reason as version job: persisted App token is needed
          # because `changeset publish` creates and pushes git tags via
          # git CLI; without persisted credentials the tag push has no auth.
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093  # v6.0.8

      # No `cache: pnpm` here: the privileged release runner must not
      # deserialize the same cache that ci.yml writes to from
      # untrusted PR runs (cache-poisoning vector). Upstream
      # changesets/changesets uses `skip-cache: true` for the same
      # reason. Cold install costs ~10s per release run.
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Pin npm
        run: npm install --global npm@11.14.1 --ignore-scripts

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Build + validate all four packages in one step: test:pkg force-builds
      # with tsdown, which runs publint + attw (level: error, esm-only) natively
      # as part of the build. Upfront gate — without it a publint/attw failure
      # could occur *after* earlier packages have already published, leaving a
      # partial release.
      - name: Build + validate packages (publint + attw)
        run: pnpm test:pkg

      - name: Publish to npm
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b  # v1.8.0
        with:
          publish: pnpm exec changeset publish
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
